apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-operator
  annotations:
    evidence.digiscience.io/status: structurally-validated
    evidence.digiscience.io/hardware-validation: required
    evidence.digiscience.io/note: "No memory or fault isolation; use only for approved development workloads."
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4
