apiVersion: v1
kind: Namespace
metadata:
  name: risk-ai
  labels:
    gpu-platform.digiscience.io/enabled: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: retail-ai
  labels:
    gpu-platform.digiscience.io/enabled: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-workload-runner
  namespace: risk-ai
  annotations:
    evidence.digiscience.io/status: structurally-validated
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-workload-runner
  namespace: retail-ai
  annotations:
    evidence.digiscience.io/status: structurally-validated
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-workload-submitter
  namespace: risk-ai
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues", "workloads"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-workload-submitter
  namespace: retail-ai
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues", "workloads"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-workload-runner-binding
  namespace: risk-ai
subjects:
  - kind: ServiceAccount
    name: gpu-workload-runner
    namespace: risk-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-workload-submitter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-workload-runner-binding
  namespace: retail-ai
subjects:
  - kind: ServiceAccount
    name: gpu-workload-runner
    namespace: retail-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-workload-submitter
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-workload-guardrail
  namespace: risk-ai
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 128Gi
    requests.nvidia.com/gpu: "4"
    limits.cpu: "64"
    limits.memory: 256Gi
    limits.nvidia.com/gpu: "4"
    count/jobs.batch: "50"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-workload-guardrail
  namespace: retail-ai
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 128Gi
    requests.nvidia.com/gpu: "4"
    limits.cpu: "64"
    limits.memory: 256Gi
    limits.nvidia.com/gpu: "4"
    count/jobs.batch: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: risk-ai
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "500m"
        memory: 1Gi
      default:
        cpu: "2"
        memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: retail-ai
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "500m"
        memory: 1Gi
      default:
        cpu: "2"
        memory: 4Gi
