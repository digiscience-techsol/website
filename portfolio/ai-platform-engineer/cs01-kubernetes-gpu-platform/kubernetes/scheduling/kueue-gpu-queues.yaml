apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-shared
  annotations:
    evidence.digiscience.io/status: structurally-validated
spec:
  nodeLabels:
    gpu.platform.digiscience.io/pool: shared
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: risk-ai-gpu-cq
  annotations:
    evidence.digiscience.io/status: structurally-validated
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: risk-ai
  cohortName: shared-gpu-cohort
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: gpu-shared
          resources:
            - name: cpu
              nominalQuota: "16"
              borrowingLimit: "16"
            - name: memory
              nominalQuota: 64Gi
              borrowingLimit: 64Gi
            - name: nvidia.com/gpu
              nominalQuota: "2"
              borrowingLimit: "2"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: retail-ai-gpu-cq
  annotations:
    evidence.digiscience.io/status: structurally-validated
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: retail-ai
  cohortName: shared-gpu-cohort
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: gpu-shared
          resources:
            - name: cpu
              nominalQuota: "16"
              borrowingLimit: "16"
            - name: memory
              nominalQuota: 64Gi
              borrowingLimit: 64Gi
            - name: nvidia.com/gpu
              nominalQuota: "2"
              borrowingLimit: "2"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: risk-ai-gpu
  namespace: risk-ai
  annotations:
    evidence.digiscience.io/status: structurally-validated
spec:
  clusterQueue: risk-ai-gpu-cq
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: retail-ai-gpu
  namespace: retail-ai
  annotations:
    evidence.digiscience.io/status: structurally-validated
spec:
  clusterQueue: retail-ai-gpu-cq
