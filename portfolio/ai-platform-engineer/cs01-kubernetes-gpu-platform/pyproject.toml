[project]
name = "gpu-platform-evidence"
version = "0.1.0"
description = "CPU-safe evidence simulator for GPU quota, borrowing, priority and pre-emption"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gpu-platform-sim = "gpu_platform_cli.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
