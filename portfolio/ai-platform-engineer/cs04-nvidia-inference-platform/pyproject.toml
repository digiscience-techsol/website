[project]
name = "triton-inference-evidence"
version = "0.1.0"
description = "Dependency-free HTTP health, inference and load evidence client for Triton-compatible endpoints"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
triton-evidence = "inference_evidence:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["inference_evidence"]
