name: Lane 2 CS04 Inference Evidence Validation

on:
  pull_request:
    paths:
      - "portfolio/ai-platform-engineer/cs04-nvidia-inference-platform/**"
      - ".github/workflows/lane2-cs04-inference-validation.yml"
  push:
    branches:
      - main
      - "agent/lane2-ai-platform-engineer"
    paths:
      - "portfolio/ai-platform-engineer/cs04-nvidia-inference-platform/**"
      - ".github/workflows/lane2-cs04-inference-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference-client-tests:
    name: HTTP inference client and load evidence tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/ai-platform-engineer/cs04-nvidia-inference-platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: portfolio/ai-platform-engineer/cs04-nvidia-inference-platform/pyproject.toml

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Compile source
        run: python -m compileall -q src

      - name: Run mock-endpoint integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate inference request JSON
        run: python -m json.tool examples/request.json >/dev/null

      - name: Check Triton configuration evidence labels
        run: |
          grep -q 'dynamic_batching' models/model_repository/synthetic_classifier/config.pbtxt
          grep -q 'KIND_GPU' models/model_repository/synthetic_classifier/config.pbtxt
          grep -q 'configuration-present-model-artifact-not-yet-published' \
            models/model_repository/synthetic_classifier/config.pbtxt
          echo "Triton configuration is present and its evidence boundary is explicit."
